<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Creation Date Power-Up</title>
  <!-- Load Trello Power-Up Client Library -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    // Utility function: Convert Trello ID (MongoDB ObjectId) into a JS Date object
    function getCreationDateFromId(id) {
      const timestamp = parseInt(id.substring(0, 8), 16) * 1000;
      return new Date(timestamp);
    }

    // Initialize the Trello Power-Up
    window.TrelloPowerUp.initialize({
      // 1. Badge on the front of the card (Board View)
      'card-badges': function (t, options) {
        return t.card('id').then(function (card) {
          const date = getCreationDateFromId(card.id);
          
          // Format date for board view (e.g., "Jan 15")
          const formattedDate = date.toLocaleDateString(undefined, {
            month: 'short',
            day: 'numeric'
          });

          return [{
            text: 'Created: ' + formattedDate,
            color: null // Options: 'blue', 'green', 'red', 'yellow', 'purple', etc., or null for neutral
          }];
        });
      },

      // 2. Badge on the inside of the card (Card Detail View)
      'card-detail-badges': function (t, options) {
        return t.card('id').then(function (card) {
          const date = getCreationDateFromId(card.id);

          // Format date and time for detail view (e.g., "Jan 15, 2024, 2:30 PM")
          const formattedDate = date.toLocaleString(undefined, {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
          });

          return [{
            title: 'Created Date',
            text: formattedDate,
            color: 'sky'
          }];
        });
      }
    });
  </script>
</body>
</html>
